<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Illustrated work desk with notebook, books, terminal, plant, and companion">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#251F1A" flood-opacity=".14"/></filter>
  <pattern id="paper" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M4 7h8M20 20h8M8 30h6" stroke="#4C4036" stroke-opacity=".05" stroke-width="1.2" stroke-linecap="round"/>
  </pattern>
  <style>
    .ink{stroke:#1E1A17;stroke-linecap:round;stroke-linejoin:round}
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#1E1A17}
    .sans{font-family:'Trebuchet MS',Arial,sans-serif}
  </style>
</defs>
<rect width="1200" height="360" rx="24" fill="#F2E6D3"/>
<rect x="10" y="10" width="1180" height="340" rx="20" fill="url(#paper)" opacity=".95"/>
<path d="M0 282Q160 263 300 282T610 280T920 287T1200 278V360H0Z" fill="#E7D4B7"/>
<path d="M0 289Q165 272 312 289T610 288T912 294T1200 285" fill="none" stroke="#C9B493" stroke-width="3"/>

<!-- notebook -->
<g transform="translate(56 58) rotate(-3)">
  <rect x="0" y="0" width="310" height="188" rx="16" fill="#FFFDF7" class="ink" stroke-width="4" filter="url(#shadow)"/>
  <path d="M26 31q14 -11 28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#D7C5AE" stroke-width="2"/>
  <text x="26" y="69" class="serif" font-size="25" font-weight="700">today's idea</text>
  <text x="26" y="99" class="sans" font-size="17" fill="#5A5149">make the weird thing useful.</text>
  <path d="M26 121Q85 112 145 121T280 120" fill="none" stroke="#4C72C9" stroke-width="4" stroke-linecap="round"/>
  <path d="M26 150Q86 140 150 150T278 149" fill="none" stroke="#B7A796" stroke-width="3" stroke-linecap="round"/>
  <path d="M230 92l19 21-28 18" fill="none" stroke="#E26A5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- books -->
<g transform="translate(398 226)">
  <ellipse cx="106" cy="48" rx="114" ry="12" fill="#C9B493" opacity=".45"/>
  <rect x="0" y="11" width="196" height="34" rx="7" fill="#4C72C9" class="ink" stroke-width="4"/>
  <rect x="16" y="-30" width="205" height="36" rx="7" fill="#D8B766" class="ink" stroke-width="4" transform="rotate(3 16 -30)"/>
  <rect x="8" y="-69" width="180" height="34" rx="7" fill="#E26A5B" class="ink" stroke-width="4" transform="rotate(-4 8 -69)"/>
  <path d="M26 25H168M38 -11H186M26 -53H154" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- terminal -->
<g transform="translate(650 112) rotate(1.5)">
  <rect x="0" y="0" width="320" height="176" rx="18" fill="#2E3340" class="ink" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="6" fill="#E26A5B"/><circle cx="49" cy="28" r="6" fill="#D8B766"/><circle cx="70" cy="28" r="6" fill="#6B9D69"/>
  <rect x="22" y="52" width="276" height="89" rx="11" fill="#3B4352"/>
  <path d="M44 86L61 101L44 116" fill="none" stroke="#FFFDF7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M76 118H162" stroke="#A9D6C0" stroke-width="5" stroke-linecap="round"/>
  <text x="24" y="163" class="sans" font-size="17" fill="#D6E0E8">$ build something weird</text>
</g>

<!-- companion peeking from behind terminal -->
<g transform="translate(582 102)">
  <ellipse cx="0" cy="170" rx="51" ry="10" fill="#C9B493" opacity=".4"/>
  <path d="M-42 145Q-35 107 0 102Q35 107 42 145L31 160Q0 171-31 160Z" fill="#1E1A17"/>
  <path d="M-31 112L-39 82L-12 99M31 112L39 82L12 99" fill="#1E1A17"/>
  <circle cx="-12" cy="128" r="4.5" fill="#FFFDF7"/><circle cx="12" cy="128" r="4.5" fill="#FFFDF7"/>
  <path d="M-9 143Q0 149 9 143" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round"/>
  <path d="M-31 137L-50 131M31 137L50 131" stroke="#1E1A17" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- plant -->
<g transform="translate(1030 202)">
  <ellipse cx="0" cy="88" rx="64" ry="12" fill="#C9B493" opacity=".4"/>
  <path d="M-28 58Q-10 45 0 54Q12 45 31 58L18 92H-17Z" fill="#D8B766" class="ink" stroke-width="4"/>
  <path d="M0 54Q-58 22-58 58Q-48 88-4 67Z" fill="#6B9D69" class="ink" stroke-width="4"/>
  <path d="M0 54Q48 18 58 54Q46 88 4 68Z" fill="#7DAF7A" class="ink" stroke-width="4"/>
  <path d="M0 60Q0 15 7 -16" class="ink" stroke-width="4"/>
  <path d="M-9 41Q-18 22-40 12M10 39Q20 18 39 10" class="ink" stroke-width="3"/>
</g>

<!-- small note -->
<g transform="translate(354 48) rotate(2)">
  <rect x="0" y="0" width="205" height="82" rx="12" fill="#F7F0E3" class="ink" stroke-width="3" filter="url(#shadow)"/>
  <text x="18" y="30" class="serif" font-size="18" font-weight="700">things I keep around</text>
  <text x="18" y="56" class="sans" font-size="15" fill="#5A5149">notes, tabs, half-finished ideas.</text>
  <path d="M18 68Q78 61 144 68" fill="none" stroke="#E26A5B" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>