<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- warm paper background -->
  <rect width="64" height="64" rx="12" fill="#f6e6b9"/>
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#c4a86e" stroke-width="1.2" opacity=".35"/>
  
  <!-- hand-drawn P — stem with a natural wobble -->
  <path d="M22 14 C21.5 18 21.8 28 22.2 38 C22.4 42 22.1 46 21.8 50" 
        fill="none" stroke="#2e2924" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- hand-drawn P — bowl, slightly lopsided like real handwriting -->
  <path d="M22 14 C23 12 26 10.5 30 10.5 C36 10.5 41 13 41 19.5 C41 25 37 28 30 28 C26 28 23.5 27.2 22 26" 
        fill="none" stroke="#2e2924" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- small ink flick at the top of the stem — hand-drawn feel -->
  <path d="M22 14 C20.5 13.2 19 12.8 18 13.5" 
        fill="none" stroke="#2e2924" stroke-width="3" stroke-linecap="round"/>
  
  <!-- tiny dot accent, like a pen lift mark -->
  <circle cx="44" cy="48" r="2.2" fill="#c85849" opacity=".7"/>
</svg>
