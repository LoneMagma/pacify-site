<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Hand-drawn note saying still building">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#251F1A" flood-opacity=".14"/></filter>
  <style>
    .ink{stroke:#1E1A17;stroke-linecap:round;stroke-linejoin:round}
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#1E1A17}
    .sans{font-family:'Trebuchet MS',Arial,sans-serif}
  </style>
</defs>
<rect width="1200" height="260" rx="24" fill="#EEE0C9"/>
<path d="M0 212Q160 194 320 214T640 209T930 214T1200 206V260H0Z" fill="#E0CCAB"/>
<path d="M0 217Q160 200 316 219T642 214T930 218T1200 211" fill="none" stroke="#C8B494" stroke-width="3"/>

<!-- left mini lamp -->
<g transform="translate(66 36)">
  <path d="M44 166V82M55 166V82" class="ink" stroke-width="5"/>
  <path d="M27 82L50 51L76 82Z" fill="#D8B766" class="ink" stroke-width="4"/>
  <path d="M52 53Q45 42 34 38Q48 25 64 38Q54 43 52 53Z" fill="#FFF7D5" class="ink" stroke-width="3"/>
  <circle cx="49" cy="171" r="30" fill="#F7F0E3" class="ink" stroke-width="4"/>
  <text x="22" y="177" class="sans" font-size="13" fill="#5A5149">still here</text>
</g>

<!-- center wave -->
<g transform="translate(270 143)">
  <path d="M0 34Q46 8 92 34T184 32T276 34" fill="none" stroke="#4C72C9" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 28l12 22M83 28l12 22M146 28l12 22M208 28l12 22" class="ink" stroke-width="3"/>
  <text x="0" y="72" class="sans" font-size="16" fill="#5A5149">one small bug at a time.</text>
</g>

<!-- note -->
<g transform="translate(730 43) rotate(-2)">
  <rect x="0" y="0" width="370" height="154" rx="16" fill="#FFFDF7" class="ink" stroke-width="4" filter="url(#shadow)"/>
  <path d="M22 22H348" stroke="#D7C5AE" stroke-width="2"/>
  <text x="26" y="61" class="serif" font-size="30" font-weight="700">still building.</text>
  <rect x="24" y="78" width="320" height="56" rx="10" fill="#F7F0E3" class="ink" stroke-width="2.5"/>
  <text x="40" y="107" class="sans" font-size="18" fill="#5A5149">temporary permanent mess.</text>
  <text x="40" y="126" class="sans" font-size="15" fill="#E26A5B">please ignore the sawdust.</text>
</g>

<!-- corner marks -->
<path d="M1143 40q20 18 0 36" fill="none" stroke="#E26A5B" stroke-width="4" stroke-linecap="round"/>
<path d="M1168 50q16 11 0 25" fill="none" stroke="#4C72C9" stroke-width="4" stroke-linecap="round"/>
<circle cx="1128" cy="225" r="7" fill="#6B9D69"/>
<circle cx="1150" cy="230" r="5" fill="#D8B766"/>
</svg>